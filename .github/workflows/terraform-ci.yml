name: Terraform CI

# Runs on every push to main and on every PR targeting main, but only
# when files under terraform/** change.
on:
  push:
    branches: [main]
    paths:
      - "terraform/**"
      - ".github/workflows/terraform-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "terraform/**"
      - ".github/workflows/terraform-ci.yml"

concurrency:
  group: terraform-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  terraform-checks:
    name: fmt + validate
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"

      # terraform fmt -check fails if any file is not canonically
      # formatted. This is the lowest-friction way to enforce
      # consistent code style across contributors.
      - name: terraform fmt check (recursive)
        run: terraform fmt -check -recursive
        working-directory: terraform

      # terraform validate runs per-module. We do not need an AWS
      # backend or credentials for validate; it is a pure syntax /
      # type check against each module's required_providers list.
      - name: terraform validate (dev env)
        run: |
          terraform init -backend=false
          terraform validate
        working-directory: terraform/environments/dev

      - name: terraform validate (bootstrap)
        run: |
          terraform init -backend=false
          terraform validate
        working-directory: terraform/bootstrap