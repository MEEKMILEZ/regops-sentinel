version: 0.2

phases:
  pre_build:
    commands:
      - echo "Logging in to Amazon ECR"
      - aws ecr get-login-password --region $AWS_DEFAULT_REGION | docker login --username AWS --password-stdin $AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com
      - COMMIT_HASH=$(echo $CODEBUILD_RESOLVED_SOURCE_VERSION | cut -c 1-7)
      - if [ -z "$COMMIT_HASH" ]; then COMMIT_HASH=$(date +%Y%m%d%H%M%S); fi
      - IMAGE_TAG_VERSIONED=v-$COMMIT_HASH
      - echo "Image tag versioned $IMAGE_TAG_VERSIONED"

  build:
    commands:
      - echo "Building Brain Docker image"
      - cd app/brain
      - docker build -t $ECR_REPO_URL:$IMAGE_TAG -t $ECR_REPO_URL:$IMAGE_TAG_VERSIONED .

  post_build:
    commands:
      - echo "Pushing image to ECR"
      - docker push $ECR_REPO_URL:$IMAGE_TAG
      - docker push $ECR_REPO_URL:$IMAGE_TAG_VERSIONED
      - echo "Image pushed successfully"