</g>
<text class="th gray-text-h" x="580" y="552" text-anchor="middle" dominant-baseline="central">User</text>
<text class="ts gray-text-s" x="580" y="572" text-anchor="middle" dominant-baseline="central">Compliance team</text>
</g>

<!-- Legend -->
<g transform="translate(40, 620)">
<text class="plane-label" x="0" y="0">Legend</text>
<line class="arr" x1="0" y1="14" x2="24" y2="14" marker-end="url(#arrow)"/>
<text class="legend-text" x="32" y="18">data flow</text>
<line class="arr" x1="120" y1="14" x2="144" y2="14" stroke-dasharray="3 3" marker-end="url(#arrow)"/>
<text class="legend-text" x="152" y="18">auth (JWT)</text>
</g>

</svg>